<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Icons</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Permanent+Marker&family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/66aa7c98b3.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --sketch-dark: #2c2c2c;
            --sketch-light: #f9f9f9;
            --accent-color: #e74c3c;
            --paper-texture: #fff;
            --doodle-color1: #ffd700;
            --doodle-color2: #4CAF50;
            --doodle-color3: #2196F3;
        }

        body {
            font-family: 'Indie Flower', cursive;
            background: var(--paper-texture);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Doodles */
        .background-doodles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }

        .doodle {
            position: absolute;
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .doodle::before {
            content: '✎';
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: var(--sketch-dark);
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, 30px) rotate(120deg); }
            66% { transform: translate(-30px, 15px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Squiggly Lines Background */
        .squiggly-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.05;
            background-image: 
                repeating-linear-gradient(45deg, transparent 0, transparent 35px, var(--sketch-dark) 35px, var(--sketch-dark) 37px),
                repeating-linear-gradient(-45deg, transparent 0, transparent 35px, var(--accent-color) 35px, var(--accent-color) 37px);
        }

        .social-menu {
            transform: rotate(-2deg);
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .social-menu ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            padding: 2rem;
            background: var(--sketch-light);
            border: 2px solid var(--sketch-dark);
            position: relative;
        }

        .social-menu ul::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid var(--sketch-dark);
            opacity: 0.3;
            transform: rotate(2deg);
            z-index: -1;
        }

        .social-menu ul li {
            transform: rotate(2deg);
            transition: transform 0.3s ease;
        }

        .social-menu ul li:hover {
            transform: rotate(-2deg) scale(1.1);
        }

        .social-menu ul li a {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: var(--sketch-light);
            border: 2px solid var(--sketch-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sketch-dark);
            text-decoration: none;
            font-size: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .social-menu ul li a:hover {
            background: var(--accent-color);
            color: var(--sketch-light);
            transform: scale(1.1);
        }

        .social-menu ul li a::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid var(--sketch-dark);
            border-radius: 50%;
            opacity: 0.2;
            z-index: -1;
        }

        /* Generate multiple doodles with JavaScript */
        @media (max-width: 768px) {
            .social-menu ul {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="squiggly-bg"></div>
    <div class="background-doodles" id="doodleContainer"></div>

    <div class="social-menu">
        <ul>
            <li><a href="https://github.com/ganeshkantle" target="blank"><i class="fab fa-github"></i></a></li>
            <li><a href="https://www.linkedin.com/in/ganeshkantle" target="blank"><i class="fab fa-linkedin-in"></i></a></li>
            <li><a href="https://instagram.com/_.ganesshhh_" target="blank"><i class="fab fa-instagram"></i></a></li>
        </ul>
    </div>

    <script>
        // Generate random doodles
        const doodleContainer = document.getElementById('doodleContainer');
        const numberOfDoodles = 20;
        const doodleSymbols = ['✎', '✏', '✍', '✌', '☮', '♥', '☺', '★'];

        for (let i = 0; i < numberOfDoodles; i++) {
            const doodle = document.createElement('div');
            doodle.className = 'doodle';
            
            // Random positioning
            doodle.style.left = `${Math.random() * 100}%`;
            doodle.style.top = `${Math.random() * 100}%`;
            
            // Random animation delay
            doodle.style.animationDelay = `${Math.random() * 5}s`;
            
            // Random symbol
            doodle.textContent = doodleSymbols[Math.floor(Math.random() * doodleSymbols.length)];
            
            // Random color
            const colors = ['var(--doodle-color1)', 'var(--doodle-color2)', 'var(--doodle-color3)'];
            doodle.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            doodleContainer.appendChild(doodle);
        }
    </script>
</body>
</html>
