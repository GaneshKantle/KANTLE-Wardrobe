<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Men's Clothing Store</title>
    <style>
        /* Font Imports */
@import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Permanent+Marker&family=Covered+By+Your+Grace&display=swap');

:root {
    --sketch-dark: #2c2c2c;
    --sketch-light: #f9f9f9;
    --accent-color: #e74c3c;
    --paper-texture: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Indie Flower', cursive;
    background: var(--paper-texture);
    color: var(--sketch-dark);
    line-height: 1.6;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 1rem 0;
}

header h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: 2rem;
    display: inline-block;
    position: relative;
}

header h1::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: var(--sketch-dark);
    animation: draw 2s ease-in-out infinite;
}

.product-details {
    width: 800px;
    max-width: 90%;
    margin: 2rem auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    padding: 1.5rem;
    background: var(--sketch-light);
    border: 2px solid var(--sketch-dark);
    position: relative;
    transform: rotate(-1deg);
}

.product-details::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: -5px;
    bottom: -5px;
    border: 2px solid var(--sketch-dark);
    opacity: 0.3;
    transform: rotate(2deg);
    z-index: -1;
}

.product-image {
    position: relative;
    transform: rotate(1deg);
    max-width: 350px;
    margin: 0 auto;
}

.product-image img {
    width: 100%;
    height: auto;
    border: 2px solid var(--sketch-dark);
    transition: transform 0.3s ease;
}

.product-image img:hover {
    transform: scale(1.02) rotate(-1deg);
}

.product-info {
    padding: 1rem;
    font-size: 1.1rem;
}

.product-info p {
    margin-bottom: 1rem;
    position: relative;
    padding-left: 1rem;
}

.product-info p::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 2px;
    background: var(--sketch-dark);
    opacity: 0.2;
}

.product-info strong {
    font-family: 'Covered By Your Grace', cursive;
    font-size: 1.2rem;
    color: var(--accent-color);
}

button {
    font-family: 'Covered By Your Grace', cursive;
    font-size: 1.1rem;
    padding: 8px 20px;
    margin-right: 10px;
    border: 2px solid var(--sketch-dark);
    background: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transform: rotate(-1deg);
    transition: all 0.3s ease;
}

button:hover {
    background: var(--sketch-dark);
    color: var(--sketch-light);
    transform: rotate(0deg);
}

.buy-button {
    background: var(--accent-color);
    color: var(--sketch-light);
    transform: rotate(1deg);
}

.buy-button:hover {
    background: var(--sketch-dark);
    transform: rotate(0deg);
}

footer {
    text-align: center;
    padding: 1rem;
    margin-top: 2rem;
    font-family: 'Covered By Your Grace', cursive;
    font-size: 1rem;
}

@keyframes draw {
    0% { transform: scaleX(0.9); }
    50% { transform: scaleX(1.1); }
    100% { transform: scaleX(0.9); }
}

/* Responsive Design */
@media (max-width: 768px) {
    .product-details {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem;
        width: 95%;
    }

    .product-info {
        padding: 0.5rem;
    }

    button {
        width: 100%;
        margin-bottom: 0.5rem;
        margin-right: 0;
    }
    
    .product-image {
        max-width: 280px;
    }
}
    </style>
</head>
<body>
    <header>
        <h1>Product Details</h1>
    </header>
    <main>
        <section class="product-details">
            <!-- <h2>T-Shirt</h2> -->
            <div class="product-image">
                <img src="Pant 4.jpg" alt="T-Shirt">
            </div>
            <div class="product-info">
                <p><strong>Price:</strong> 1499/-</p>
                <p><strong>Color:</strong> Blue</p>
                <p><strong>Size:</strong> S, M, L, XL</p>
                <p><strong>Description:</strong> A Light mercerised  narrow blue jeans.</p>
                <button>Add to Cart</button>
                <button class="buy-button">Buy Now</button>

            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Kantle's Wardrobe®</p>
    </footer>
</body>
</html>
