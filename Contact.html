.contact-form {
    width: var(--container-width);
    max-width: 95%;
    margin-top: clamp(50px, 8vw, 80px);
    padding: clamp(1rem, 2vw, 1.5rem);
    background: var(--sketch-light);
    border: 2px solid var(--sketch-dark);
    position: relative;
    transform: rotate(-1deg);
}

.contact-form::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: -5px;
    bottom: -5px;
    border: 2px solid var(--sketch-dark);
    opacity: 0.3;
    transform: rotate(2deg);
    z-index: -1;
}

h2 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(1.2rem, 2vw, 1.5rem);
    margin-bottom: 0.8rem;
    color: var(--accent-color);
}

.contact-form p {
    margin-bottom: 1.5rem;
    font-size: clamp(0.9rem, 1.2vw, 1rem);
    line-height: 1.5;
}

form {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
}

label {
    font-family: 'Covered By Your Grace', cursive;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    color: var(--sketch-dark);
    margin-bottom: -0.4rem;
}

input, textarea {
    font-family: 'Indie Flower', cursive;
    font-size: clamp(0.9rem, 1.2vw, 1rem);
    padding: clamp(8px, 1.2vw, 12px);
    border: 2px solid var(--sketch-dark);
    background: var(--paper-texture);
    border-radius: 4px;
    transform: rotate(-0.5deg);
    transition: all 0.3s ease;
    min-height: 44px;
    width: 100%;
}

textarea {
    min-height: clamp(100px, 15vw, 120px);
    resize: vertical;
}

input:focus, textarea:focus {
    outline: none;
    transform: rotate(0deg);
    border-color: var(--accent-color);
    box-shadow: 0 0 5px rgba(231, 76, 60, 0.2);
}

button {
    font-family: 'Covered By Your Grace', cursive;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    padding: clamp(8px, 1.2vw, 12px) clamp(16px, 2.5vw, 20px);
    margin-top: 0.5rem;
    border: 2px solid var(--sketch-dark);
    background: var(--sketch-dark);
    color: var(--sketch-light);
    cursor: pointer;
    align-self: flex-start;
    border-radius: 4px;
    transition: all 0.3s ease;
    min-height: 44px;
    min-width: 44px;
}

button:hover {
    background: var(--accent-color);
    border-color: var(--accent-color);
    transform: translateY(-2px);
}

h3 {
    margin: 1rem 0;
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(1rem, 1.5vw, 1.2rem);
}

h3 a {
    color: var(--accent-color);
    text-decoration: none;
    position: relative;
    transition: all 0.3s ease;
}

h3 a:hover {
    color: var(--sketch-dark);
}

footer {
    text-align: center;
    padding: 1rem;
    margin-top: 1rem;
    font-family: 'Covered By Your Grace', cursive;
    font-size: 0.9rem;
    width: 100%;
}

@keyframes draw {
    0% { transform: scaleX(0.9); }
    50% { transform: scaleX(1.1); }
    100% { transform: scaleX(0.9); }
}

/* Responsive Design */
@media (max-width: 479px) {
    :root {
        --container-width: 90%;
    }
    
    .contact-form {
        padding: 1rem;
        transform: rotate(0deg);
    }

    button {
        width: 100%;
        align-self: center;
    }
}

@media (min-width: 480px) and (max-width: 767px) {
    :root {
        --container-width: 85%;
    }
}
