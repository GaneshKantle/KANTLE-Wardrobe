<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Login 1</title>
    <link rel="stylesheet" href="Index.css" />
   <style>
	/* Font Imports */
@import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Permanent+Marker&family=Covered+By+Your+Grace&display=swap');

:root {
    --sketch-dark: #2c2c2c;
    --sketch-light: #f9f9f9;
    --accent-color: #e74c3c;
    --paper-texture: #fff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Indie Flower', cursive;
    background: var(--paper-texture);
    color: var(--sketch-dark);
    line-height: 1.8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.container {
    background: var(--sketch-light);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    width: min(768px, 95%);
    max-width: 100%;
    min-height: clamp(480px, 60vh, 600px);
    border: 2px solid var(--sketch-dark);
    transform: rotate(-1deg);
}

.container::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: -5px;
    bottom: -5px;
    border: 2px solid var(--sketch-dark);
    opacity: 0.3;
    transform: rotate(2deg);
    z-index: -1;
}

.form-container {
    position: absolute;
    top: 0;
    height: 100%;
    transition: all 0.6s ease-in-out;
}

.sign-in-container {
    left: 0;
    width: 50%;
    z-index: 2;
}

.sign-up-container {
    left: 0;
    width: 50%;
    opacity: 0;
    z-index: 1;
}

.container.right-panel-active .sign-in-container {
    transform: translateX(100%);
}

.container.right-panel-active .sign-up-container {
    transform: translateX(100%);
    opacity: 1;
    z-index: 5;
}

form {
    background: var(--sketch-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 clamp(20px, 5vw, 50px);
    height: 100%;
    text-align: center;
}

h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(1.5rem, 3vw, 2rem);
    margin-bottom: clamp(15px, 2.5vw, 20px);
    position: relative;
}

h1::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: var(--sketch-dark);
    animation: draw 2s ease-in-out infinite;
}

input {
    background: none;
    border: 2px solid var(--sketch-dark);
    padding: clamp(10px, 1.5vw, 12px) clamp(12px, 2vw, 15px);
    margin: clamp(6px, 1vw, 8px) 0;
    width: 100%;
    font-family: 'Indie Flower', cursive;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    transform: rotate(-1deg);
    min-height: 44px;
}

input:focus {
    outline: none;
    transform: rotate(0deg);
}

button {
    font-family: 'Covered By Your Grace', cursive;
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    padding: clamp(10px, 1.5vw, 12px) clamp(35px, 5vw, 45px);
    margin-top: clamp(15px, 2.5vw, 20px);
    border: 2px solid var(--sketch-dark);
    background: none;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    min-height: 44px;
    min-width: 44px;
}

button:hover {
    background: var(--sketch-dark);
    color: var(--sketch-light);
}

.overlay-container {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    overflow: hidden;
    transition: transform 0.6s ease-in-out;
    z-index: 100;
}

.container.right-panel-active .overlay-container {
    transform: translateX(-100%);
}

.overlay {
    background: var(--accent-color);
    color: var(--sketch-light);
    position: relative;
    left: -100%;
    height: 100%;
    width: 200%;
    transform: translateX(0);
    transition: transform 0.6s ease-in-out;
}

.container.right-panel-active .overlay {
    transform: translateX(50%);
}

.overlay-panel {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 clamp(20px, 4vw, 40px);
    text-align: center;
    top: 0;
    height: 100%;
    width: 50%;
    transform: translateX(0);
    transition: transform 0.6s ease-in-out;
}

.overlay-left {
    transform: translateX(-20%);
}

.overlay-right {
    right: 0;
    transform: translateX(0);
}

.container.right-panel-active .overlay-left {
    transform: translateX(0);
}

.container.right-panel-active .overlay-right {
    transform: translateX(20%);
}

.social-container {
    margin: 20px 0;
}

.social-container a {
    border: 2px solid var(--sketch-dark);
    border-radius: 50%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 5px;
    height: clamp(40px, 5vw, 44px);
    width: clamp(40px, 5vw, 44px);
    min-height: 44px;
    min-width: 44px;
    text-decoration: none;
    color: var(--sketch-dark);
    transform: rotate(-2deg);
    transition: all 0.3s ease;
}

.social-container a:hover {
    transform: rotate(0deg);
    background: var(--sketch-dark);
    color: var(--sketch-light);
}

@keyframes draw {
    0% { transform: scaleX(0.9); }
    50% { transform: scaleX(1.1); }
    100% { transform: scaleX(0.9); }
}

@media (max-width: 767px) {
    .container {
        min-height: clamp(600px, 100vh, 800px);
        transform: rotate(0deg);
    }
    .form-container {
        width: 100%;
        height: 100%;
    }
    .overlay-container {
        display: none;
    }
    body {
        padding: 1rem;
    }
}

@media (max-width: 479px) {
    .container {
        width: 100%;
        border-radius: 0;
    }
    form {
        padding: 0 1rem;
    }
}
   </style>
  </head>
  <body>
  
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Create Account</h1>
                <!-- <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div> -->
                <span>or use your email for registration</span>
                <input type="text" placeholder="Name" />
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button>Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Sign in</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your account</span>
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <a href="#">Forgot your password?</a>
                <button>Sign In</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const signUpButton = document.getElementById("signUp");
const signInButton = document.getElementById("signIn");
const container = document.getElementById("container");

signUpButton.addEventListener("click", () => {
	container.classList.add("right-panel-active");
});

signInButton.addEventListener("click", () => {
	container.classList.remove("right-panel-active");
});

    </script>
  </body>
</html>
