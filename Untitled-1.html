<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Quiz App</title>
    <style>
        body {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    border: 2px dashed #333;
    border-radius: 10px;
    background-color: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    position: relative;
}

.title {
    text-align: center;
    font-size: 2.5em;
    color: #333;
    text-shadow: 1px 1px 0 #fff;
}

.quiz-container {
    display: none;
}

.question {
    font-size: 1.5em;
    margin-bottom: 20px;
    color: #555;
}

.options {
    margin-bottom: 20px;
}

.option {
    background-color: #e0e0e0;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 10px;
    margin: 5px 0;
    cursor: pointer;
    transition: background-color 0.3s;
}

.option:hover {
    background-color: #d0d0d0;
}

.next-button, .restart-button {
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.3s;
}

.next-button:hover, .restart-button:hover {
    background-color: #45a049;
}

.result-container {
    display: none;
    text-align: center;
}

#score {
    font-weight: bold;
    font-size: 1.5em;
}
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Sketch Quiz</h1>
        <div id="quiz" class="quiz-container">
            <div id="question" class="question"></div>
            <div id="options" class="options"></div>
            <button id="next" class="next-button">Next</button>
        </div>
        <div id="result" class="result-container">
            <h2>Your Score: <span id="score"></span></h2>
            <button id="restart" class="restart-button">Restart Quiz</button>
        </div>
    </div>
    <script>
        const questions = [
    {
        question: "What is the capital of France?",
        options: ["Berlin", "Madrid", "Paris", "Lisbon"],
        answer: "Paris"
    },
    {
        question: "Which planet is known as the Red Planet?",
        options: ["Earth", "Mars", "Jupiter", "Saturn"],
        answer: "Mars"
    },
    {
        question: "Who wrote 'Romeo and Juliet'?",
        options: ["Mark Twain", "William Shakespeare", "Charles Dickens", "Jane Austen"],
        answer: "William Shakespeare"
    },
    {
        question: "What is the largest ocean on Earth?",
        options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
        answer: "Pacific Ocean"
    }
];

let currentQuestionIndex = 0;
let score = 0;

const quizContainer = document.getElementById('quiz');
const questionElement = document.getElementById('question');
const optionsElement = document.getElementById('options');
const nextButton = document.getElementById('next');
const resultContainer = document.getElementById('result');
const scoreElement = document.getElementById('score');
const restartButton = document.getElementById('restart');

nextButton.addEventListener('click', () => {
    const selectedOption = document.querySelector('input[name="option"]:checked');
    if (selectedOption) {
        const answer = selectedOption.nextElementSibling.textContent;
        if (answer === questions[currentQuestionIndex].answer) {
            score++;
        }
        currentQuestionIndex++;
        loadQuestion();
    }
});

restartButton.addEventListener('click', () => {
    currentQuestionIndex = 0;
    score = 0;
    resultContainer.style.display = 'none';
    quizContainer.style.display = 'block';
    loadQuestion();
});

function loadQuestion() {
    if (currentQuestionIndex < questions.length) {
        const currentQuestion = questions[currentQuestionIndex];
        questionElement.textContent = currentQuestion.question;
        optionsElement.innerHTML = '';
        currentQuestion.options.forEach(option => {
            const optionElement = document.createElement('div');
            optionElement.classList.add('option');
            optionElement.innerHTML = `
                <input type="radio" name="option" id="${option}" value="${option}">
                <label for="${option}">${option}</label>
            `;
            optionsElement.appendChild(optionElement);
        });
    } else {
        showResult();
    }
}

function showResult() {
    quizContainer.style.display = 'none';
    resultContainer.style.display = 'block';
    scoreElement.textContent = `${score} out of ${questions.length}`;
}

document.addEventListener('DOMContentLoaded', () => {
    quizContainer.style.display = 'block';
    loadQuestion();
});
    </script>
</body>
</html>
